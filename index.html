<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>ТИШИНА</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=55944881">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>

  <nav class="dock" id="dock" aria-label="Разделы">
    <button class="dock__item" data-tab="today" aria-label="Главная">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/></svg>
      <span>Главная</span>
    </button>
    <button class="dock__item" data-tab="course" aria-label="Курс">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></svg>
      <span>Курс</span>
    </button>
    <button class="dock__item dock__item--main" data-tab="practice" aria-label="Практика">
      <span class="dock__orb"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.6"/><ellipse cx="12" cy="6.2" rx="2" ry="3.2"/><ellipse cx="12" cy="17.8" rx="2" ry="3.2"/><ellipse cx="6.2" cy="12" rx="3.2" ry="2"/><ellipse cx="17.8" cy="12" rx="3.2" ry="2"/></svg></span>
      <span>Практика</span>
    </button>
    <button class="dock__item" data-tab="answers" aria-label="Ответы">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4 3.5V16h0A2.5 2.5 0 0 1 5 13.5z"/><path d="M10 8.6a2 2 0 1 1 2.6 1.9c-.4.1-.6.5-.6.9v.4"/><circle cx="12" cy="13.4" r=".3"/></svg>
      <span>Ответы</span>
    </button>
    <button class="dock__item" data-tab="path" aria-label="Мой путь">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c3.5 0 3.5-6 7-6s3.5-6 7-6"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="7" r="1.6"/></svg>
      <span>Путь</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js?v=5b5cbd3a"></script>
  <script src="app.js?v=49e618f6"></script>
</body>
</html>
